# ml config: where on SharePoint the sources, the parameter catalog and the batch
# table are, and the settings.
#
# Code, configuration and data are kept apart, and the data lives on SharePoint:
# every input is read from the location given below, and every output is written
# there. There is no local data option.
#
#   ml validate             validate this config without running anything
#   ml check-catalog        what the sources record that the catalog does not list;
#                           writes catalog_report.html, catalog_manifest.json and
#                           new_parameters.csv into the catalog's folder (Data/catalog/)
#   ml build                the batch table: every batch, cleaned and derived; writes
#                           batch_data.xlsx, batch_data.parquet, build_report.html and
#                           batch_table_manifest.json into its folder (Data/batch_data/)
#   ml task new <folder>    a task workspace with an annotated task.yaml
#   ml task run             run the task in this folder; runs go into <folder>/runs/
#
# Secrets (SharePoint credentials, drive ids) go in a .env next to this file; see
# .env.example. Relative paths (cleaning.corrections) are relative to THIS file.

seed: 20260917

sources:
  databricks: true        # join the Acridine Orange readings from Databricks

# Where everything lives on SharePoint. `sheet` is the worksheet the data is on.
# catalog and batch_table are also where the stages write: each stage's outputs go
# into the folder of its file.
sharepoint:
  catalog:        {path: "MS%26T%20MSAT%20Data%20Team//Reports/Adv%20Analystics%20%26%20AI/Data/catalog/catalog.xlsx", sheet: Catalogue, drive_id: DRIVE_ID_GHENT}
  batch_table:    {path: "MS%26T%20MSAT%20Data%20Team//Reports/Adv%20Analystics%20%26%20AI/Data/batch_data/batch_data.xlsx", sheet: Sheet1, drive_id: DRIVE_ID_GHENT}
  phf_ghent:      {path: "Batch data/PHF.xlsm", sheet: BR Data, drive_id: DRIVE_ID_GHENT}
  phf_raritan:    {path: "General/Batch Data/Commercial Manufacturing Data.xlsx", sheet: BR Data, drive_id: DRIVE_ID_TIGER}
  param_mapping:  {path: "MS%26T%20MSAT%20Data%20Team/GxP%20container/ParameterRequirements.xlsx", sheet: Overall, drive_id: DRIVE_ID_GHENT}
  remfg:          {path: "General/BAT Resources/Re-Manufacturing Analyses/Re-MFG Trend_LIVE.xlsx", sheet: Treatment Line Data, drive_id: DRIVE_ID_TIGER}
  lv_coa:         {path: "MS%26T%20MSAT%20Data%20Team//Reports/Adv%20Analystics%20%26%20AI/Data/LVV%20CoA/LV CoA Correlation with CAR 29SEP.xlsx", sheet: CoA extracts, drive_id: DRIVE_ID_GHENT}
  raw_materials:  {path: "MS%26T%20MSAT%20Data%20Team//Reports/Adv%20Analystics%20%26%20AI/Data/Consumables/Consumables raw materials and equipment investigators.xlsx", sheet: Consumables raw materials and e, drive_id: DRIVE_ID_GHENT}
  investigations: {path: "Documentation%20-%20Overall%20CAR-T%20EMEA%20Program/MSAT/Investigations/Trend%20Team/2.%20Investigations/2.%20Reliability%20Pillar/2026-02%20OOS%20rate%20OBL%20vs%20TL/Power%20Query%20Commercial%20Obelisc%20%26%20Techlane.xlsx", sheet: Master Query ALL COM, drive_id: DRIVE_ID_GHENT}
  site_maps:
    folder: "MS%26T%20MSAT%20Data%20Team//Reports/Adv%20Analystics%20%26%20AI/Data/mappings/"
    files: [clinical_sites.xlsx, cross_data_meeting.xlsx, from_Hannelore.xlsx]
    sheet: Sheet1
    drive_id: DRIVE_ID_GHENT

catalog:
  write_new_parameters: true

build:
  write_parquet: true      # a batch_data.parquet beside batch_data.xlsx, which keeps column types

cleaning:
  # corrections: ~/ml_data/corrections.yaml   # known data corrections, as a table;
  #                                            # default: the package's own table
  disable: []                     # names of corrections to switch off
  censored: limit                 # what '<0.5' becomes: limit | half | missing
  censored_flags: false           # also add a '<column> censored' 0/1 column
  duration_unit: minutes          # what a bare number in a duration cell means
  yes_no_defaults:                # blanks filled only for these columns
    'Pre-Activation Clumps: Y/N?': 'No'

mapping:
  exclude:                        # Raritan → Ghent mapping rows known to be wrong
    - Non-Conformance Type Calc.

features:
  co2_target: 5.0
  temp_target: 37.0
  contact_target: 120.0
  contact_tolerance: 30.0
  seeding_tolerance: 5.0
  cpdl_low: 4.0
  cpdl_high: 5.0
  lactate_low: 12.5
  lactate_high: 30.0
  cd4_low: 40.0
  cd4_high: 60.0

lv_coa:
  ph_nominal: 7.2       # release-spec midpoints, never a data mean
  osmo_nominal: 300.0
