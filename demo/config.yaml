# The demo config, written by `python -m ml.demo`. Every source is made up, and
# the SharePoint drive is the folder sharepoint/ (see .env).
seed: 20260917
sources:
  databricks: false
sharepoint:
  catalog:
    path: Data/catalog/catalog.xlsx
    drive_id: DEMO_DRIVE
    sheet: 0
  batch_table:
    path: Data/batch_data/batch_data.xlsx
    drive_id: DEMO_DRIVE
    sheet: Sheet1
  phf_ghent:
    path: Data/raw/phf_ghent.xlsx
    drive_id: DEMO_DRIVE
  phf_raritan:
    path: Data/raw/phf_raritan.xlsx
    drive_id: DEMO_DRIVE
  param_mapping:
    path: Data/raw/parameter_requirements.xlsx
    drive_id: DEMO_DRIVE
  remfg:
    path: Data/raw/remfg.xlsx
    drive_id: DEMO_DRIVE
  lv_coa:
    path: Data/raw/lv_coa.xlsx
    drive_id: DEMO_DRIVE
  raw_materials:
    path: Data/raw/raw_materials.xlsx
    drive_id: DEMO_DRIVE
  investigations:
    path: Data/raw/investigations_power_query.xlsx
    drive_id: DEMO_DRIVE
  site_maps:
    folder: Data/raw/
    files:
    - site_map_hannelore.xlsx
    - site_map_meeting.xlsx
    sheet: 0
    drive_id: DEMO_DRIVE
catalog:
  write_new_parameters: true
build:
  write_parquet: true
cleaning:
  corrections: corrections.yaml
  censored: limit
  censored_flags: false
  duration_unit: minutes
  raritan_type_commercial: true
  yes_no_defaults:
    'Pre-Activation Clumps: Y/N?': 'No'
mapping:
  exclude:
  - Non-Conformance Type Calc.
features:
  co2_target: 5.0
  temp_target: 37.0
  contact_target: 120.0
  contact_tolerance: 30.0
  seeding_tolerance: 5.0
  cpdl_low: 4.0
  cpdl_high: 5.0
  lactate_low: 12.5
  lactate_high: 30.0
  cd4_low: 40.0
  cd4_high: 60.0
lv_coa:
  ph_nominal: 7.2
  osmo_nominal: 300.0
