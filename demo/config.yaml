# The demo config, written by `python -m ml.demo`. Every source is made up, and
# the SharePoint drive is the folder sharepoint/ (see .env).
seed: 20260917
sources:
  databricks: false
sharepoint:
  vocabulary:
    path: Data/raw/vocabulary.xlsx
    drive_id: DEMO_DRIVE
  catalog:
    path: Data/catalog/catalog.xlsx
    drive_id: DEMO_DRIVE
  batch_table:
    path: Data/batch_data/batch_data.xlsx
    drive_id: DEMO_DRIVE
  screening:
    path: Data/catalog/parameter_screening.xlsx
    drive_id: DEMO_DRIVE
  phf_site_a:
    path: Data/raw/site_a_batch_records.xlsx
    drive_id: DEMO_DRIVE
  phf_site_b:
    path: Data/raw/site_b_batch_records.xlsx
    drive_id: DEMO_DRIVE
  param_mapping:
    path: Data/raw/parameter_mapping.xlsx
    drive_id: DEMO_DRIVE
  remfg:
    path: Data/raw/remfg.xlsx
    drive_id: DEMO_DRIVE
  lv_coa:
    path: Data/raw/lv_coa.xlsx
    drive_id: DEMO_DRIVE
  raw_materials:
    path: Data/raw/raw_materials.xlsx
    drive_id: DEMO_DRIVE
  investigations:
    path: Data/raw/investigations_power_query.xlsx
    drive_id: DEMO_DRIVE
  site_maps:
    folder: Data/raw/
    files:
    - site_map_first.xlsx
    - site_map_second.xlsx
    drive_id: DEMO_DRIVE
catalog:
  write_new_parameters: true
build:
  write_parquet: true
  date_column: incubator_in_d0
  missingness_cohort:
    column: batch_type
    value: type_commercial
    all_batches_at:
    - b
cleaning:
  censored: limit
  censored_flags: false
  duration_unit: minutes
  yes_no_defaults:
    pre_activation_clumps_yn: 'No'
mapping:
  exclude:
  - excluded_mapping_row
features:
  co2_target: 5.0
  temp_target: 37.0
  contact_target: 120.0
  contact_tolerance: 30.0
  seeding_tolerance: 5.0
  cpdl_low: 4.0
  cpdl_high: 5.0
  lactate_low: 12.5
  lactate_high: 30.0
  cd4_low: 40.0
  cd4_high: 60.0
  seeding_target_per_vessel: 50000000.0
  shift_cutoff: '11:59'
  moi_target: 0.5
  medium_glucose: 4.5
  medium_lactate: 0.1
  impurity_spec_limits:
  - 5.0
  - 10.0
  - 5.0
  - 3.0
  - 3.0
  availability_column: Available At
  availability_order:
  - D0
  - D1
  - D3
  - D6
  - D8
  - D10
  - Harvest
  - Post-thaw
  - Wash
  - Formulation
  - Final product
  - Release
  - Post-release
lv_coa:
  ph_nominal: 7.2
  osmo_nominal: 300.0
