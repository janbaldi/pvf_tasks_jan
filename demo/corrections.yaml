# Known data corrections, applied by `pvf build` while cleaning the site files.
#
# Each rule: site, column, ONE action, and optionally a condition and a reason.
#   set: <value>            replace the value (null → missing)
#   replace_text: [[a, b]]  substring replacements, applied in order
#   replace_values: {a: b}  whole-value replacements
#   divide_by: <number>     rescale a numeric column (applied after type coercion)
#   when: {equals: v}                  only rows where this column is v (as text)
#   when: {column: other, equals: v}   only rows where another column is v
# A named rule can be switched off with `cleaning.disable: [name]` in pvf.yaml.

corrections:
  - name: clump_count_date_serial
    site: SiteB
    column: "<clumps_mix_count>"
    when: {equals: "<value:mangled_count>"}
    set: null
    reason: a clump count Excel turned into a date serial

  - name: israel_country
    site: SiteB
    column: Country
    when: {column: <clinical_site>, equals: "<value:clinical_sites_b>"}
    set: Israel
    reason: the site is in Israel; the export has the wrong country

  - name: site_b_type_commercial
    site: SiteB
    column: Type
    set: Commercial
    reason: the SiteB export does not fill Type, and everything it holds is commercial manufacturing

  - name: site_b_oos_type_spelling
    site: SiteB
    column: <oos_type>
    replace_text:
      - [VIability, Viability]
      - [<value:oos_raw>, Dose]
      - ["<value>", "<value>"]
      - [<value>, <value>]
      - [Concentration, <value>]
      - [CAR, <coa_car_metric>]
      - [<value>, <coa_car_metric>]
      - [Phenotype, <value>]
      - [Potency, <value>]
      - [<value>, <value>]
    reason: SiteB spells OOS types its own way

  - name: site_a_oos_type_spelling
    site: SiteA
    column: <oos_type>
    replace_text:
      - [<value>, <value>]
    reason: one spelling for one OOS type

  - name: qcgs03v_pre_activation_clumps
    site: SiteA
    column: "<pre_activation_clumps_yn>"
    when: {column: "Patient Lot/Batch #", equals: <value:bad_lot>}
    set: "No"
    reason: a known bad cell for lot <value:bad_lot>

  - name: site_a_mycoplasma_spelling
    site: SiteA
    column: Mycoplasma
    replace_values: {<value:mycoplasma_raw>: <value:mycoplasma_clean>}
    reason: one spelling for a negative result

  - name: site_b_withdrawal_spelling
    site: SiteB
    column: <nonconformance>
    replace_values: {withdrawn: withdrawal}
    reason: one spelling for a withdrawal

  # Scale: some counts are stored without their 1e6 divisor.
  - {site: SiteB, column: <cells_per_bag>, divide_by: 1000000, reason: stored without the 1e6 divisor}
  - {site: SiteB, column: <cells_for_recovery>, divide_by: 1000000, reason: stored without the 1e6 divisor}
  - {site: SiteB, column: <formulated_concentration_a>, divide_by: 1000000, reason: stored without the 1e6 divisor}
  - {site: SiteB, column: <formulated_concentration_b>, divide_by: 1000000, reason: stored without the 1e6 divisor}
  - {site: SiteA, column: "<seeding_density_a>", divide_by: 1000000, reason: stored without the 1e6 divisor}
  - {site: SiteA, column: "<seeding_density_b>", divide_by: 1000000, reason: stored without the 1e6 divisor}
