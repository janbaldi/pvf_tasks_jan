# The effective settings of this run, defaults included.
task:
  name: raritan_release
  question: What does a released Raritan batch look like, next to a discarded one?
  purpose: exploratory
  seed: 20260917
inputs:
  pvf: /home/sdegroeve/pvf_tasks/demo/PVF.xlsx
  ptf: /home/sdegroeve/pvf_tasks/demo/PTF.xlsx
output:
  root: /home/sdegroeve/pvf_tasks/demo/explorations
cohort:
  sites:
  - Raritan
  site_column: Site Merged
  filters:
  - column: Manufacturing and Release Testing Completed? (Y/N)
    op: equals
    value: Y
    missing: exclude
    normalise: false
    reason: manufacturing and testing finished
  date_column: ''
  date_from: ''
  date_to: ''
target:
  column: Disposition
  type: binary
  positive_class: Released
  negative_class: Discarded
  missing: drop
columns:
  id: 'Patient Lot/Batch #'
  group: Vector Lot
  include: []
  exclude:
  - column: OOS Type
    reason: it is the reason for the disposition
availability:
  cutoff: ''
  reviewed: false
  unavailable: []
  available: []
encoding:
  one_hot: true
  target_encoding: true
  feature_hashing: true
  one_hot_top_x: 10
  onehot_max_categories: 5
  target_max_categories: 6
  max_cardinality_ratio: 0.5
  target_encoding_smoothing: 5.0
  target_encoding_folds: 5
  target_encoding_fallback: hashing
  hashing_min_buckets: 8
  hashing_max_buckets: 16
  hashing_signed: true
  missing_category: missing
quality:
  min_non_missing: 8
  duplicate_r2_threshold: 0.99
  duplicate_min_overlap: 8
clustering:
  action: linear
  method: spearman
  threshold: 0.8
  min_size: 2
  min_overlap: 8
  prefer: []
missingness:
  enabled: true
  threshold: 0.9
  min_rate: 0.05
  max_rate: 0.95
  min_size: 2
  min_strength: 0.1
  max_categories: 20
split:
  strategy: ''
  validation_fraction: 0.25
  order_column: ''
report:
  preview_rows: 10
  max_table_rows: 500
