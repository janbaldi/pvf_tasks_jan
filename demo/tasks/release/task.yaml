# A demo task workspace written by `python -m ml.demo`. Its runs go to runs/.
config: ../../config.yaml
task:
  name: release
  question: What does an accepted Southbank batch look like, next to a scrapped one?
  seed: 20260917
cohort:
  sites:
  - Southbank
  filters:
  - column: Testing complete (Y/N)
    op: equals
    value: Y
    reason: manufacturing and testing finished
target:
  column: Outcome
  type: binary
  positive_class: Accepted
  negative_class: Scrapped
roles:
  id: 'Patient Lot/Batch #'
  group: Vector lot
predictors:
  exclude:
  - column: Out-of-spec class
    reason: it is the reason for the outcome
  exclude_by_catalog:
    Available At:
    - Post-release
encoding:
  onehot_max_categories: 5
  target_max_categories: 6
  target_encoding_smoothing: 5.0
  target_encoding_folds: 5
  hashing_max_buckets: 16
  target_min_rows_per_category: 3
  hashing_min_rows: 20
  missing_indicators: true
quality:
  min_non_missing: 8
  duplicate_r2_threshold: 0.99
  duplicate_min_overlap: 8
clustering:
  action: summarise
  name_by: Available At
  method: spearman
  threshold: 0.8
  min_overlap: 8
report:
  preview_rows: 10
