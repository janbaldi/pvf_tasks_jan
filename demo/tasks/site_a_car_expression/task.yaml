# A demo task workspace written by `python -m pvf.demo`. Its runs go to runs/.
config: ../../config.yaml
task:
  name: site_a_car_expression
  question: Which manufacturing parameters go with final product CAR+ expression at
    SiteA?
  purpose: predictive
  seed: 20260917
cohort:
  sites:
  - SiteA
  filters:
  - column: Type
    op: equals
    value: Commercial
    reason: manufactured commercially
  - column: <testing_done>
    op: equals
    value: Y
    reason: manufacturing and testing finished
  - column: <nonconformance>
    op: not_in
    value:
    - termination
    - withdrawal
    normalise: true
    missing: include
    reason: not terminated or withdrawn, however it is spelled
target:
  column: <fp_car_pct>
  type: numeric
columns:
  id: 'Patient Lot/Batch #'
  group: <vector_lot>
  exclude:
  - column: <subject_weight>
    reason: dose per kilogram already carries it
availability:
  cutoff: Harvest
  unavailable:
  - column: <washed_cells>
    reason: counted after the wash
encoding:
  onehot_max_categories: 5
  target_max_categories: 6
  target_encoding_smoothing: 5.0
  target_encoding_folds: 5
  hashing_max_buckets: 16
quality:
  min_non_missing: 8
  duplicate_r2_threshold: 0.99
  duplicate_min_overlap: 8
clustering:
  action: report_only
  method: spearman
  threshold: 0.7
  min_overlap: 8
report:
  preview_rows: 15
