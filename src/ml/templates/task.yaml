# A task: one cohort, one target, one question asked of the batch table.
# This folder is the task's workspace. Every run goes to runs/<run id>/ with the
# batch table and catalog it read, so the folder holds everything needed to redo it.
#
# From inside this folder:   ml validate                  check it against the batch table
#                             ml task run                  run it
#                             ml task rerun runs/<run id>  redo a run from its own folder
#
# Relative paths are relative to this file. Quote any column name that has a
# '#', ':' or '%' in it — unquoted, `Patient Lot/Batch #` ends at the '#'.

# The config.yaml that names the batch table and catalog.
# (Or name them yourself: inputs: {batch_table: ..., catalog: ...}.)
__CONFIG__

task:
  name: __NAME__
  question: "__QUESTION__"
  seed: 20260917

cohort:
  sites: []                       # e.g. [Ghent]; empty means every site
  filters: []                     # applied in order; operators: equals, not_equals, in,
                                  # not_in, min, max, is_null, not_null. For example:
  # - {column: Type, op: equals, value: Commercial, reason: manufactured commercially}
  # - {column: Non-Conformance Type, op: not_in, value: [termination, withdrawal],
  #    normalise: true, missing: include, reason: not terminated or withdrawn}

target:
  column: "__TARGET__"
  type: __TARGET_TYPE__           # numeric | binary
  # positive_class: Released      # required for a binary target
  # negative_class: Discarded

# What some columns are. They are kept as metadata, never used as predictors.
roles:
  id: 'Patient Lot/Batch #'       # identifies a batch
  group: Vector Lot               # grouping column, for grouped cross-validation later
  # patient: Patient ID           # joins a patient's batches into one group

# Which other batch table columns may be predictors.
predictors:
  # include: []                   # an explicit predictor list, if you have one
  exclude: []                     # single columns: [{column: ..., reason: ...}]
  include_by_catalog: {}          # {catalog column: [the only values kept]}
  exclude_by_catalog: {}          # {catalog column: [values left out]}
  # e.g. exclude_by_catalog: {Available At: [Release, Post-release]}

# Parameters that move together. Every run writes metadata/groups.json: explain
# the model per group (sum SHAP values, permute together), not per parameter.
clustering:
  action: describe                # off | describe | keep_one | residualise | summarise
  method: spearman
  threshold: 0.7                  # |r| at which parameters are grouped
  min_overlap: 10
  min_stability: 0.8              # act only on groups found in 80% of subsamples
  # name_by: Process step         # a catalog column whose shared value names a group

# encoding:  {missing_indicators: false, impute: none, target_min_rows_per_category: 5}
# quality:   {min_non_missing: 20, duplicate_r2_threshold: 0.99, near_constant_tolerance: 0.0001}
# missingness: {enabled: true}
