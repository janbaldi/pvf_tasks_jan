# pvf workspace config.
#
# This folder is a workspace: configuration and data, kept apart from the code.
# Every relative path below is relative to THIS file, so the folder can be moved.
#
#   pvf ptf      what the sources record that the PTF does not list
#   pvf build    the PVF: every batch, every parameter, cleaned and derived
#   pvf tasks    every task in tasks/ (or --task <file>), each into its own run folder
#   pvf all      the three in order
#   pvf new-task <name>     a new task file, wired to this workspace
#   pvf check               validate this config and the tasks without running anything

seed: 20260917

# Local copies of every source. With sources.location: local these are read.
paths:
  ptf: data/raw/PTF.xlsx
  phf_site_a: data/raw/phf_site_a.xlsx
  phf_site_b: data/raw/phf_site_b.xlsx
  param_mapping: data/raw/parameter_requirements.xlsx
  remfg: data/raw/remfg.xlsx
  lv_coa: data/raw/lv_coa.xlsx
  raw_materials: data/raw/raw_materials.csv
  investigations: data/raw/investigations_power_query.xlsx
  site_maps:
    - data/raw/site_map_clinical_sites.xlsx
  # Outputs
  pvf: data/processed/PVF.xlsx            # the PTF and build manifests are written beside it
  new_parameters: data/processed/new_parameters.csv
  reports: outputs/reports
  tasks: outputs/tasks                    # task run folders, unless a task says otherwise
  task_files: tasks                       # where `pvf new-task` writes and `pvf tasks` looks

# Which worksheet each workbook's data is on, where it is not the default.
# sheets:
#   phf_site_a: <sheet:phf_site_a>

sources:
  location: local          # local | sharepoint
  fallback_to_local: false # with sharepoint: use the local copy if io_sharepoint is missing
  databricks: false        # join the Acridine Orange readings from Databricks

# Where each source lives on SharePoint. Only read when sources.location is
# sharepoint; a source without an entry here is then still read locally.
sharepoint:
  ptf:            {path: "<team-site>//Reports/<analytics>/Data/PTF/PTF.xlsx", sheet: Catalogue, drive_id: DRIVE_ID_SITE_A}
  pvf:            {path: "<team-site>//Reports/<analytics>/Data/PVF/PVF.xlsx", sheet: Sheet1, drive_id: DRIVE_ID_SITE_A}
  phf_site_a:      {path: "<site-a-folder>/phf.xlsm", sheet: <sheet:phf_site_a>, drive_id: DRIVE_ID_SITE_A}
  phf_site_b:    {path: "<site-b-folder>/batch_records.xlsx", sheet: <sheet:phf_site_a>, drive_id: DRIVE_ID_SITE_B}
  param_mapping:  {path: "<team-site>/<mapping-folder>/parameter_mapping.xlsx", sheet: Overall, drive_id: DRIVE_ID_SITE_A}
  remfg:          {path: "<site-b-folder>/remfg.xlsx", sheet: <sheet:remfg>, drive_id: DRIVE_ID_SITE_B}
  lv_coa:         {path: "<team-site>//Reports/<analytics>/Data/lv_coa.xlsx", sheet: <sheet:lv_coa>, drive_id: DRIVE_ID_SITE_A}
  raw_materials:  {path: "<team-site>//Reports/<analytics>/Data/raw_materials.xlsx", sheet: <sheet:raw_materials>, drive_id: DRIVE_ID_SITE_A}
  investigations: {path: "<investigations>/power_query.xlsx", sheet: <sheet:investigations>, drive_id: DRIVE_ID_SITE_A}
  site_maps:
    folder: "<team-site>//Reports/<analytics>/Data/mappings/"
    files: [clinical_sites.xlsx, cross_data_meeting.xlsx, from_Hannelore.xlsx]
    sheet: Sheet1
    drive_id: DRIVE_ID_SITE_A

# Uploading the PVF is a separate decision from reading the share: it only
# happens on a `pvf build --mode PRD` run with enabled: true.
upload:
  enabled: false
  path: "<team-site>//Reports/<analytics>/Data/PVF/"   # or $DATA_LINK
  drive_id: DRIVE_ID_SITE_A
  file_name: PVF.xlsx

ptf:
  write_new_parameters: true

build:
  write_parquet: true      # a PVF.parquet beside PVF.xlsx, which keeps column types

cleaning:
  corrections: corrections.yaml   # known data corrections, as a table
  disable: []                     # names of corrections to switch off
  censored: limit                 # what '<0.5' becomes: limit | half | missing
  censored_flags: false           # also add a '<column> censored' 0/1 column
  duration_unit: minutes          # what a bare number in a duration cell means
  yes_no_defaults:                # blanks filled only for these columns
    '<pre_activation_clumps_yn>': 'No'

mapping:
  exclude:                        # SiteB → SiteA mapping rows known to be wrong
    - <excluded_mapping_row>

features:
  co2_target: 5.0
  temp_target: 37.0
  contact_target: 120.0
  contact_tolerance: 30.0
  seeding_tolerance: 5.0
  cpdl_low: 4.0
  cpdl_high: 5.0
  lactate_low: 12.5
  lactate_high: 30.0
  cd4_low: 40.0
  cd4_high: 60.0

lv_coa:
  ph_nominal: 7.2       # release-spec midpoints, never a data mean
  osmo_nominal: 300.0
