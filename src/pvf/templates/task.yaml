# A task: one cohort, one target, one question asked of the PVF.
# This folder is the task's workspace. Every run goes to runs/<run id>/ with the
# PVF and PTF it read, so the folder holds everything needed to redo it.
#
# Check it with:   pvf check --task __FOLDER__
# Run it with:     pvf tasks --task __FOLDER__
#
# The PVF and PTF come from config.yaml (or name them: inputs: {pvf: ..., ptf: ...}).
# Relative paths are relative to this file. Quote any column name that has a
# '#', ':' or '%' in it — unquoted, `Patient Lot/Batch #` ends at the '#'.

task:
  name: __NAME__
  question: "__QUESTION__"
  purpose: __PURPOSE__            # exploratory | predictive
  seed: 20260917

cohort:
  sites: []                       # e.g. [SiteA]; empty means every site
  filters: []                     # applied in order; operators: equals, not_equals, in,
                                  # not_in, min, max, is_null, not_null. For example:
  # - {column: Type, op: equals, value: Commercial, reason: manufactured commercially}
  # - {column: <nonconformance>, op: not_in, value: [termination, withdrawal],
  #    normalise: true, missing: include, reason: not terminated or withdrawn}

target:
  column: "__TARGET__"
  type: __TARGET_TYPE__           # numeric | binary
  # positive_class: Released      # required for a binary target
  # negative_class: Discarded

# Which PVF columns go into the dataset.
columns:
  id: 'Patient Lot/Batch #'       # identifies a batch; never a predictor
  group: <vector_lot>               # grouping metadata, for grouped cross-validation later
  # patient: <patient_id>
  # include: []                   # an explicit predictor list, if you have one
  exclude: []                     # single columns: [{column: ..., reason: ...}]
  exclude_categories: {}          # by a PTF column: {PTF column: [categories to leave out]}
  # exclude_categories:
  #   Available At: [Release, Post-release]

# Only for a predictive task: what is known at the moment of prediction.
# With an 'Available At' column in the PTF, everything from a later stage — or
# with no stage — is left out. Stages: D0 D1 D3 D6 D8 D10 Harvest Wash
# Formulation "Final product" Post-thaw Release Post-release.
availability:
  cutoff: __CUTOFF__
  unavailable: []                 # extra exclusions: [{column: ..., reason: ...}]
  available: []                   # parameters allowed whatever their stage

clustering:
  action: report_only             # off | report_only | representative | linear | nonlinear
  method: spearman
  threshold: 0.7
  min_overlap: 10

# encoding:  {missing_indicators: false, impute: none, target_min_rows_per_category: 5}
# quality:   {min_non_missing: 20, duplicate_r2_threshold: 0.99, near_constant_tolerance: 0.0001}
# missingness: {enabled: true}
